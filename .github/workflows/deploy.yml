name: Validate admin panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript
        run: node --check assets/admin.js
      - name: Prepare static site
        run: |
          mkdir -p dist/assets
          cp index.html dist/
          cp -R assets/* dist/assets/
          test -s dist/index.html
          test -s dist/assets/admin.css
          test -s dist/assets/admin.js
          grep -q 'id="page-users"' dist/index.html
          grep -q 'id="page-orders"' dist/index.html
          grep -q 'id="page-products"' dist/index.html
